name: Checks

# This repository is a curated slice of a larger checkout: the simulation framework
# (`rl/`, which is also where the `mjrl` package lives), the robot assets and the
# checkpoints stay upstream. That has a consequence worth stating plainly instead of
# hiding behind a green badge: the ~80 test files in `tests/` cannot run here, because
# importing `mjrl` resolves outside this tree. They run in the upstream checkout, and the
# reports quote their results from there.
#
# So CI checks what this tree can honestly prove about itself — that it lints, that every
# relative link resolves inside the tree, and that nothing upstream has been copied in.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch: a push to a pull request's branch would otherwise start the same
# three jobs twice, and a superseded run is not worth its checkouts.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      # Pinned, because ruff's own findings moved under this repository once already
      # (see the note above [tool.ruff.lint] in pyproject.toml, which pins it too). The
      # rule groups are written out there as well, so a new default cannot widen the check.
      - run: python -m pip install --disable-pip-version-check ruff==0.17.3
      - run: python -m ruff check .

  links:
    name: Relative links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      # A link that worked in the full checkout can point at a file this slice does not
      # carry. This turns that drift into a red build instead of a dead end for a reader.
      - run: python tools/check_links.py

  slice:
    name: Slice guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      # Fails if a checkpoint, an upstream asset tree or a build output is ever committed:
      # those are a publication decision, not a convenience.
      - run: python tools/check_slice.py