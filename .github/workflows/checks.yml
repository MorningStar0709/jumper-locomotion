name: Checks

# This repository is a curated slice of a larger checkout: the simulation framework, the
# robot assets and the checkpoints live upstream, so the full test suite cannot run here.
# What CI checks is what this tree can honestly prove about itself — that it lints, that
# every relative link resolves, and that nothing upstream has been copied in by accident.
# The test suite itself runs in the upstream checkout; the reports quote it.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The rule set lives in pyproject.toml, so the ruff version is not what decides
      # what passes here.
      - run: python -m pip install --disable-pip-version-check ruff
      - run: python -m ruff check .

  links:
    name: Relative links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # A link that worked in the full checkout can point at a file this slice does not
      # carry. This turns that drift into a red build instead of a dead end for a reader.
      - run: python tools/check_links.py

  slice:
    name: Slice guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Fails if a checkpoint, an upstream asset tree or a build output is ever committed:
      # those are a publication decision, not a convenience.
      - run: python tools/check_slice.py